<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Icône de l'application GRN map : globe orange sur fond bleu nuit (couleurs de la carte) -->
  <rect width="512" height="512" fill="#0c1a2b"/>
  <circle cx="256" cy="226" r="150" fill="#c4561a"/>
  <!-- Méridiens et parallèles -->
  <g fill="none" stroke="#0c1a2b" stroke-width="10">
    <ellipse cx="256" cy="226" rx="62" ry="150"/>
    <line x1="256" y1="76" x2="256" y2="376"/>
    <line x1="110" y1="176" x2="402" y2="176"/>
    <line x1="110" y1="276" x2="402" y2="276"/>
  </g>
  <text x="256" y="458" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="76" font-weight="800" fill="#ffffff" letter-spacing="6">GRN</text>
</svg>
